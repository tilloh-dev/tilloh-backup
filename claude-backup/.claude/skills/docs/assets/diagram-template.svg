<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title description">
  <title id="title">System flow</title>
  <desc id="description">A request moves from the client through the service to storage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .boundary { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; }
      .node { fill: #ffffff; stroke: #475569; stroke-width: 2; }
      .node-accent { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .node-data { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; }
      .label { fill: #0f172a; font: 600 18px system-ui, sans-serif; text-anchor: middle; }
      .detail { fill: #334155; font: 14px system-ui, sans-serif; text-anchor: middle; }
      .boundary-label { fill: #475569; font: 600 14px system-ui, sans-serif; }
      .flow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .flow-label-bg { fill: #f8fafc; }
      .flow-label { fill: #334155; font: 14px system-ui, sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect class="canvas" width="960" height="520" rx="16"/>
  <rect class="boundary" x="310" y="90" width="580" height="340" rx="18"/>
  <text class="boundary-label" x="334" y="122">System boundary</text>

  <path class="flow" d="M 250 260 H 380"/>
  <path class="flow" d="M 580 260 H 710"/>
  <rect class="flow-label-bg" x="278" y="226" width="74" height="22" rx="4"/>
  <rect class="flow-label-bg" x="586" y="226" width="118" height="22" rx="4"/>
  <text class="flow-label" x="315" y="242">Request</text>
  <text class="flow-label" x="645" y="242">Validated data</text>

  <rect class="node" x="70" y="200" width="180" height="120" rx="12"/>
  <text class="label" x="160" y="252">Client</text>
  <text class="detail" x="160" y="280">Starts the request</text>

  <rect class="node-accent" x="380" y="200" width="200" height="120" rx="12"/>
  <text class="label" x="480" y="252">Service</text>
  <text class="detail" x="480" y="280">Validates input</text>

  <rect class="node-data" x="710" y="200" width="180" height="120" rx="12"/>
  <text class="label" x="800" y="252">Storage</text>
  <text class="detail" x="800" y="280">Persists data</text>
</svg>
