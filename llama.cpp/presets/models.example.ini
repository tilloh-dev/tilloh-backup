# Ornith-1.5-35B-A3B: qwen35moe, ~3B active, native 262144 ctx. Q4_K_M = 20.7 GiB.
# Hybrid attention (Gated-DeltaNet layers carry no growing KV) => context is nearly
# VRAM-free: 131072..262144 all load with ~1.6 GiB free on a 23 GB card. So ctx is a
# pure speed choice, not a fit choice. Measured gen-speed sweep (hermine/CUDA, short
# prompt, q8_0 KV): 131072~83 t/s, 163840~79, 196608~75, 262144~65 t/s. 163840 chosen
# (95% of peak, matches the Laguna sibling window; user decision 2026-08-20). 262144
# is available at -22% gen speed if the full window is needed.
# spec-type = ngram-mod, NOT draft-mtp: the GGUF embeds an MTP/NextN head (blk.N.nextn.*,
# repo name lacks -MTP-), but enabling draft-mtp measured 15-20% SLOWER here (73/65 vs
# 82/85 t/s, acceptance 0.30-0.38) -- the A3B target forward is too cheap to pay back the
# draft overhead (same pattern as Nemotron). Lossless, so this is a speed-only decision.
# reasoning: thinking is ON by default (card + measured reasoning_content). No reasoning=on
# needed (unlike Laguna). reasoning-preserve = true: template consumes reasoning_content
# from history; llama.cpp itself logs "chat template supports preserving reasoning".
# Sampling: card's general set temp=0.6/top-p=0.95/top-k=20 (benchmarks use temp=1.0).
# cache-type-v = q4_0 here is the Vulkan floor (this example targets the RX 7900 XTX box);
# the CUDA models.ini on hermine uses q8_0/q8_0 (matched pair for the fused FA kernel).
[Ornith-1.5-35B-A3B]
alias = Ornith-1.5-35B-Q4_K_M.gguf
model = /home/USER/.local/share/llama.cpp/models/Ornith-1.5-35B-A3B/Ornith-1.5-35B-Q4_K_M.gguf
ctx-size = 163840
n-gpu-layers = -1
fit = off
cache-type-k = q8_0
cache-type-v = q8_0
flash-attn = on
jinja = true
reasoning-format = auto
reasoning-preserve = true
parallel = 1
cache-reuse = 256
spec-type = ngram-mod
spec-ngram-mod-n-match = 24
spec-ngram-mod-n-min = 48
spec-ngram-mod-n-max = 64
temp = 0.6
top-p = 0.95
top-k = 20
load-mode = dio
kv-unified = true

