# Qwen3.8-Flash-Next — 125B MoE (6B active) + 51B n-gram embeddings, arch qwen4exp
# (needs llama.cpp >= b10740; nightly-tag pointer lagged behind the merge, see
# docs/llama-operations.md before trusting `latest`).
# Does NOT fit a single 24 GB card: runs only with VRAM pooled over llama.cpp RPC
# (second GPU in the LAN; there: ggml-rpc-server -H 0.0.0.0 -p 50052 -d <GPU> -c)
# plus expert offload to host CPU/RAM.
# fit = on is DELIBERATE here (repo-wide default is off): the auto-fit placement
# measured 10.2-10.4 t/s generation vs 8.5-8.9 with the best hand-written
# n-gpu-layers/tensor-split/override-tensor combination (A/B 2026-09-03). Larger
# -ub/-b raised prefill (+17-28 %) but cost ~1.3 t/s generation — not adopted.
# Deliberately NO `device` key: default order puts RPC first (lm_head stays local);
# an explicit `device = CUDA0,RPC0` flips the ranges and collapses generation to
# 2.9 t/s (LAN ping-pong + graph-cache thrash). `--n-cpu-moe` is always wrong with
# RPC for the same reason (first-N semantics hits the remote layers).
# Deliberately NO spec-type: ngram-mod measured 4 % draft acceptance at the card's
# temp=1.0 and made even verbatim repetition slower; qwen4exp MTP support is
# unmerged upstream (PRs #27836/#28097).
# ctx 261888 (not 262144): upstream CUDA gridDim.y abort at the full native window.
# load-mode = mlock: +25-35 % prefill, generation unchanged; the n-gram table is
# lazily read regardless (mlock does not cover it) — leave it that way.
[Qwen3.8-Flash-Next]
alias = Qwen3.8-Flash-Next
model = E:/Llama.cpp/models/Qwen3.8-Flash-Next/UD-IQ3_XXS/Qwen3.8-Flash-Next-UD-IQ3_XXS-00001-of-00003.gguf
mmproj = E:/Llama.cpp/models/Qwen3.8-Flash-Next/mmproj-F16.gguf
mmproj-offload = false
rpc = 192.168.1.39:50052
ctx-size = 261888
fit = on
fit-target = 1024,1024
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true
reasoning-format = auto
reasoning-preserve = true
parallel = 1
cache-reuse = 256
cache-ram = 16384
load-mode = mlock
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
