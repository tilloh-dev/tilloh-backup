# Retuned 2026-09-07 (build 10786): RPC dissolved on user decision — hermine-only.
# Local mmap run (NO load-mode key: mlock would fight the 82-GB file on 64 GB RAM;
# the 51B n-gram table stays lazily on NVMe, experts page-cache in host RAM).
# Measured levers: dropping RPC alone doubled tg (8.5-10.4 -> 18.5-21.6);
# threads = 8 (P-cores only on the i9-13900KF, 8P+16E) +10-15 % tg — t 12/16/24
# all measured worse (E-cores gate P-cores in ggml spin barriers, the video
# lesson holds); ubatch/batch 1024 lifts pp@19k 236 -> 366-377 at zero tg cost
# (2048 doubles pp to ~500 but costs a third of tg via fit re-placement — no).
# prio 2 measured neutral, not adopted. Final: tg 20-23 t/s, pp@19k ~370,
# ~1.4 GiB VRAM free; host RAM runs near-full (page cache, evictable).
# fit = on stays load-bearing here. MTP for qwen4exp still unmerged (PR #27836
# draft) — re-check upstream. No build pin needed anymore (no RPC pairing).
# Details: docs/models/Qwen3.8-Flash-Next.md.
