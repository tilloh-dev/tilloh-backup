# Quality flagship: highest quant below BF16 (UD-Q8_K_XL, 29.3 GiB), runs only
# with lieselotte's 7900 XTX pooled via RPC (both ends must be on the same
# llama.cpp build). Full native ctx 262144, q8_0/q8_0 KV. The RPC pipeline has
# a measured ~10 ms/token fixed sync cost, so single-token decode caps at
# ~17.5 t/s regardless of layer split — the throughput comes from amortizing
# that cost over long, confidence-gated speculative drafts: sidecar MTP drafter
# pinned to CUDA0 (device-draft is load-bearing: embedded MTP or an unpinned
# drafter re-serializes the RPC graph per token and measures SLOWER than no
# spec at all) with spec-draft-n-max 6 + spec-draft-p-min 0.5 (both needed:
# n-max 6 alone ~24, p-min 0.5 alone ~25, together 27-32 t/s prose and
# 44-53 t/s on file rewrites). tensor-split 38,27 buys ~1.1 GiB CUDA0 margin
# against Windows shell VRAM creep for ~8 % rewrite speed. NO device key
# (RPC-first default order is load-bearing). ubatch 2048 and CUDA0-heavy
# fit-targets both collapse tg. Details: docs/models/Qwen3.8-27B.md
[Qwen3.8-27B-UD-Q8_K_XL-260ctx-q8_0-rpc]
alias = Qwen3.8-27B-xl
model = E:/Llama.cpp/models/Qwen3.8-27B/Qwen3.8-27B-UD-Q8_K_XL.gguf
mmproj = E:/Llama.cpp/models/Qwen3.8-27B/mmproj-F16.gguf
mmproj-offload = false
rpc = 192.168.1.39:50052
ctx-size = 262144
n-gpu-layers = 65
tensor-split = 38,27
fit = off
cache-type-k = q8_0
cache-type-v = q8_0
flash-attn = on
jinja = true
reasoning-format = auto
reasoning-preserve = true
parallel = 1
cache-reuse = 256
model-draft = E:/Llama.cpp/models/Qwen3.8-27B/MTP/mtp-Qwen3.8-27B-Q4_0.gguf
device-draft = CUDA0
spec-type = draft-mtp,ngram-mod
