# llama-server router preset (Linux).  Adapted from countzero/windows_llama.cpp.
#
# One [section] per model. The section header is the name clients pass in the
# OpenAI-compatible "model" field. Keys are llama-server flags WITHOUT the
# leading "--"  (see:  llama-server --help  for every available flag).
#
# Setup:
#   cp presets/models.example.ini presets/models.ini
#   sed -i "s|/home/USER|$HOME|g" presets/models.ini
#
# Model paths must be ABSOLUTE and point INSIDE $LLAMA_MODELS_DIR (outside the
# repo). n-gpu-layers = -1 offloads all layers (clamped automatically).
#
# ctx-size / n-gpu-layers / n-cpu-moe / cache-type-k/v below are VERIFIED for
# the reference hardware this repo targets (AMD RX 7900 XTX, 24560 MiB VRAM,
# see llama.cpp/README.md + AGENTS.md) via
# `.opencode/skills/llama-preset/scripts/recommend.sh` — each was actually probed
# with llama-fit-params (not guessed from file size), and cache-type-k=q8_0 /
# cache-type-v=q4_0 + parallel=1 + cache-reuse + reasoning-format=auto are its
# agentic quality/speed defaults (see the skill's SKILL.md). On different
# hardware (or after a llama.cpp/driver update), re-run that skill per model;
# it prints an OPTIMIZATION DIFF against whatever is already in your models.ini.
# The spec-* keys are the exception: UNMEASURED, adopted on mechanism.
#
# Set device parameter in this order:
# 1. device = Vulkan0 - if used with a Vulkan backend
# 2. device = Cuda0   - if used with an NVIDIA GPU

[Qwen3.8-27B-small]
alias = Qwen3.8-27B-small
model = /home/USER/.local/share/llama.cpp/models/Qwen3.8-27B/Qwen3.8-27B-IQ4_XS.gguf
mmproj = /home/USER/.local/share/llama.cpp/models/Qwen3.8-27B/mmproj-F16.gguf
mmproj-offload = false
# NOTE: q8_0 @ 147456 = largest q8_0 ctx that loads on hermine (163840 OOMs on the MTP
# compute buffer even with the 4090 fully freed by the GT 610 display swap). Margin 811 MiB
# is static; an image request costs only ~70 MiB VRAM because the mmproj runs on CPU.
# Decided 2026-08-15 on build 10437, where q4_0@229376 measured equal speed (~58 t/s deep)
# and q8_0 was kept for KV quality. spec-draft-n-max=4 and no-MTP both measured slower.
# Details: AGENTS.md. Do not put comments into models.ini itself - they are deleted there.
ctx-size = 147456
n-gpu-layers = -1
cache-type-k = q8_0
cache-type-v = q8_0
flash-attn = on
jinja = true
reasoning-format = auto
reasoning-preserve = true
parallel = 1
cache-reuse = 256
fit = off
spec-type = draft-mtp,ngram-mod
spec-draft-n-max = 3
cache-type-k-draft = q4_0
cache-type-v-draft = q4_0
spec-ngram-mod-n-match = 24
spec-ngram-mod-n-min = 48
spec-ngram-mod-n-max = 64
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
cache-ram = 16384
load-mode = dio
kv-unified = true

[Qwen3.8-27B-large]
alias = Qwen3.8-27B-large
model = /home/USER/.local/share/llama.cpp/models/Qwen3.8-27B/Qwen3.8-27B-IQ4_XS.gguf
mmproj = /home/USER/.local/share/llama.cpp/models/Qwen3.8-27B/mmproj-F16.gguf
mmproj-offload = false
# NOTE: A/B twin of [Qwen3.8-27B-small] for real-scenario testing (2026-08-15, build 10437):
# full native 262144 ctx, which only fits without the MTP drafter (its pp compute buffer
# has a ~1 GiB ctx-driven floor; OOMs at every ubatch). Measured: 21241-21269 MiB
# (~1.5-1.8 GiB free), 43.2 t/s short / 32.9 t/s @103k depth, pp 1989 t/s. KV q4_0 KLD
# vs f16 = 0.0099 (q8_0: 0.0039) at <=16k depth. q4_1 looked better on KLD (0.0074) but
# collapses on CUDA: pp ~30 t/s despite being a matched pair - only q8_0/q8_0 and
# q4_0/q4_0 are throughput-verified fused pairs here. Details: docs/models/Qwen3.8-27B.md.
ctx-size = 262144
n-gpu-layers = -1
cache-type-k = q4_0
cache-type-v = q4_0
flash-attn = on
jinja = true
reasoning-format = auto
reasoning-preserve = true
parallel = 1
cache-reuse = 256
fit = off
spec-type = ngram-mod
spec-ngram-mod-n-match = 24
spec-ngram-mod-n-min = 48
spec-ngram-mod-n-max = 64
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
cache-ram = 16384
load-mode = dio
kv-unified = true

